<!DOCTYPE html>
<html>
<head>
    <title>Upload an AI Generated Image</title>
    <style>
        /* Basic styles for layout and aesthetics */
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }
        form {
            max-width: 600px;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 2px 2px 12px rgba(0,0,0,0.1);
        }
        label {
            font-weight: bold;
        }
        textarea, input[type="text"], input[type="file"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="submit"] {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #28a745;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #218838;
        }
        a {
            text-decoration: none;
            color: #007BFF;
            display: inline-block;
            margin-top: 10px;
        }
        /* Optional: Style the instruction paragraph */
        .instructions {
            background-color: #e9ecef;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>Upload an AI Generated Image</h1>
    <form method="POST" enctype="multipart/form-data">
        <label for="image">Image File:</label><br>
        <input type="file" name="image" id="image" accept="image/*" required><br>

        <label for="prompt">Prompt:</label><br>
        <textarea name="prompt" id="prompt" rows="3" placeholder="Describe the image..."></textarea><br>

        <label for="seed">Seed:</label><br>
        <input type="text" name="seed" id="seed" placeholder="Enter seed number"><br>

        <label for="model">Model:</label><br>
        <input type="text" name="model" id="model" placeholder="e.g., StableDiffusion v2"><br>

        <label for="additional_params">Additional Params:</label><br>
        <textarea name="additional_params" id="additional_params" rows="2" placeholder="e.g., Steps:50, CFG:7.0"></textarea><br>

        <label for="tags">Tags (comma-separated):</label><br>
        <input type="text" name="tags" id="tags" placeholder="e.g., futuristic, fantasy"><br>

        <input type="submit" value="Upload">
    </form>
    <a href="{{ url_for('index') }}">Back to Gallery</a>

</body>
</html>
